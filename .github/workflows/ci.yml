name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libgnutls28-dev zlib1g-dev pkg-config
      - name: Build libgadu
        run: |
          scripts/build-libgadu.sh
          echo "PKG_CONFIG_PATH=$PWD/.deps/libgadu/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Test libgadu
        run: |
          cmake -S third_party -B .deps/libgadu-tests -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build .deps/libgadu-tests --parallel
          ctest --test-dir .deps/libgadu-tests --output-on-failure
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet -tags goolm ./...
      - name: Test
        run: go test -tags goolm -race ./...
      - name: Build
        run: go build -tags goolm ./cmd/...
