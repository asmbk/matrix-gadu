name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libgadu
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgadu-dev pkg-config
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet -tags goolm ./...
      - name: Test
        run: go test -tags goolm -race ./...
      - name: Build
        run: go build -tags goolm ./cmd/...
